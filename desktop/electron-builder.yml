appId: com.guozehong12.venustest
productName: VenusTest
directories:
  output: dist-app
files:
  - main.js
  - app-identity.js
  - preload.js
  - backend-client.js
  - runtime-state.js
  - desktop-capabilities.js
  - update-flow.js
  - media-runtime.js
  - package.json
  - assets/**
extraResources:
  - from: backend-dist/live-clipper-backend
    to: backend
  - from: vendor/media-tools/darwin-arm64/ffmpeg
    to: bin/ffmpeg
  - from: vendor/media-tools/darwin-arm64/ffprobe
    to: bin/ffprobe
  - from: vendor/media-tools/darwin-arm64/licenses
    to: licenses/ffmpeg
  - from: build/app-update.yml
    to: app-update.yml
beforePack: ./scripts/prepare-media-tools.js
afterPack: ./scripts/after-pack.js
npmRebuild: false
mac:
  # Unsigned unofficial test build: do not select a Developer ID or notarize.
  identity: null
  notarize: false
  minimumSystemVersion: "14.0"
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  category: public.app-category.video
  icon: assets/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
dmg:
  sign: true
publish:
  provider: github
  owner: guozehong12
  repo: live-clipper
